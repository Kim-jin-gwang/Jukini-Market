{% extends 'layout.html' %}

{% block content %}
  <section class="form-page">
    <h1>상품 등록</h1>
    <p class="form-desc">등록한 상품은 <strong>지금부터 24시간 동안만</strong> 판매됩니다.</p>
    <form class="stack-form" action="/good" method="post" enctype="multipart/form-data">
      <label>상품명
        <input type="text" name="name" placeholder="강원도 하지 감자 3kg" required maxlength="40">
      </label>
      <label>개당 가격 (포인트)
        <input type="number" name="price" placeholder="8900" required min="1">
      </label>
      <label>판매 수량
        <input type="number" name="amount" placeholder="20" required min="1">
      </label>
      <label>상품 이미지 (jpg/png/gif/webp, 5MB 이하)
        <input type="file" name="img" accept="image/*" required>
      </label>
      <button class="btn btn-primary btn-lg" type="submit">24시간 판매 시작</button>
    </form>
  </section>
{% endblock %}
