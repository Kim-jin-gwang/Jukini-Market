<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{title}} · 쭈끼니 마켓</title>
  <link rel="stylesheet" href="/main.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a href="/" class="brand">🥬 쭈끼니 마켓</a>
      <nav class="nav">
        <a href="/">둘러보기</a>
        {% if user %}
          <a href="/good">상품 등록</a>
          <a href="/list">구매 목록</a>
          <a href="/lookup">판매 목록</a>
        {% endif %}
      </nav>
      <div class="user-area">
        {% if user %}
          <span class="user-info"><strong>{{user.nick}}</strong>님 · <span class="point">{{user.money.toLocaleString()}}P</span></span>
          <a class="btn btn-ghost" href="/auth/logout">로그아웃</a>
        {% else %}
          <form class="login-form" action="/auth/login" method="post">
            <input type="email" name="email" placeholder="이메일" required>
            <input type="password" name="password" placeholder="비밀번호" required>
            <button class="btn btn-primary" type="submit">로그인</button>
          </form>
          <a class="btn btn-ghost" href="/join">회원가입</a>
        {% endif %}
      </div>
    </div>
  </header>

  <main class="container">
    <div class="error-message flash"></div>
    {% block good %}
    {% endblock %}
    {% block content %}
    {% endblock %}
  </main>

  <footer class="site-footer">
    <span>쭈끼니 마켓 — 산지직송 농산물 24시간 한정 판매 데모</span>
    <span>
      <a href="https://github.com/Kim-jin-gwang/Jukini-Market" target="_blank" rel="noopener">GitHub</a> ·
      <a href="https://demo-gateway.trealight112.workers.dev/" target="_blank" rel="noopener">전체 프로젝트</a>
    </span>
  </footer>

  <script>
    (() => {
      const params = new URL(location.href).searchParams;
      const message = params.get('error') || params.get('loginError') || params.get('joinError');
      if (message) {
        const flash = document.querySelector('.error-message');
        flash.textContent = message;
        flash.classList.add('show');
        history.replaceState(null, '', location.pathname);
      }
    })();
  </script>
</body>
</html>
